<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weltrade AI SyntX Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(37, 99, 235, 0.5); }
      50% { box-shadow: 0 0 30px rgba(37, 99, 235, 0.9); }
    }
    .floating-radar {
      animation: pulse-glow 2.5s infinite;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8 relative">

  <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl mb-24">
    
    <!-- Header -->
    <header class="flex flex-wrap justify-between items-center pb-5 mb-5 border-b border-slate-800 gap-2">
      <div>
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
          Weltrade AI SyntX Terminal
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">Live Feed • Gemini 3.7 Flash Instant Clipboard Scanner</p>
      </div>
      <div>
        <span class="text-xs px-3 py-1 bg-blue-500/10 text-blue-400 border border-blue-500/30 rounded-full font-mono">Gemini 3.7 Active</span>
      </div>
    </header>

    <!-- Setup Keys -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">1. Google AI Studio API Key</label>
        <input type="password" id="apiKey" placeholder="Paste AIzaSy... key from Google AI Studio" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">2. Weltrade Sync Key</label>
        <input type="text" id="tvKey" value="kr8wc8tzkmlre2eucu3qlcau7ri6ery7" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200 font-mono">
      </div>
    </div>

    <!-- Live Chart Feed -->
    <div class="mb-6">
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-semibold uppercase text-slate-400">Live Weltrade TradingView Chart Hub</label>
        <a href="https://www.weltrade.com/tools/charts/" target="_blank" class="text-[11px] text-emerald-400 hover:underline">Open Chart Direct ↗</a>
      </div>
      <div class="w-full h-[520px] rounded-xl overflow-hidden border border-slate-800 bg-slate-950 relative">
        <iframe 
          id="weltradeFrame"
          src="https://www.weltrade.com/tools/charts/" 
          class="w-full h-full border-0"
          allow="fullscreen">
        </iframe>
      </div>
    </div>

    <!-- Instructions / Direct Button -->
    <button id="mainScanBtn" onclick="scanClipboard()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3.5 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
      <span>⚡ Scan Clipboard Chart (Gemini 3.7)</span>
    </button>

    <!-- Results Display -->
    <div id="results" class="hidden mt-6 bg-slate-950 border border-slate-800 rounded-xl p-5">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 border-b border-slate-800 pb-4 mb-4">
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-500 block">Action Signal</span>
          <span id="signalBadge" class="text-sm font-bold uppercase text-slate-200">--</span>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-500 block">Signal Strength</span>
          <span id="strengthBadge" class="text-sm font-bold font-mono text-emerald-400">--</span>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-500 block">Timing Status</span>
          <span id="timingBadge" class="text-sm font-bold uppercase text-slate-200">--</span>
        </div>
      </div>
      <div id="aiOutput" class="text-xs leading-relaxed text-slate-300 whitespace-pre-wrap font-mono"></div>
    </div>

  </div>

  <!-- FLOATING BLUE GEMINI BUTTON -->
  <button id="floatingAiBtn" onclick="scanClipboard()" title="Scan Latest Chart Screenshot" class="fixed bottom-6 right-6 z-50 bg-blue-600 hover:bg-blue-500 text-white rounded-full p-4 shadow-2xl border-2 border-blue-400 floating-radar flex items-center justify-center transition-all transform hover:scale-110 active:scale-95">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
    </svg>
  </button>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const tvKeyInput = document.getElementById('tvKey');
    const mainScanBtn = document.getElementById('mainScanBtn');

    // Restore saved API keys
    window.addEventListener('DOMContentLoaded', () => {
      const savedApiKey = localStorage.getItem('gemini_api_key');
      const savedTvKey = localStorage.getItem('weltrade_tv_key');
      if (savedApiKey) apiKeyInput.value = savedApiKey;
      if (savedTvKey) tvKeyInput.value = savedTvKey;
    });

    apiKeyInput.addEventListener('input', () => localStorage.setItem('gemini_api_key', apiKeyInput.value.trim()));
    tvKeyInput.addEventListener('input', () => localStorage.setItem('weltrade_tv_key', tvKeyInput.value.trim()));

    async function scanClipboard() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Please paste your Google AI Studio API key at the top first.");
        return;
      }

      mainScanBtn.disabled = true;
      mainScanBtn.innerText = "Reading Clipboard...";

      try {
        const clipboardItems = await navigator.clipboard.read();
        let imageBlob = null;

        for (const item of clipboardItems) {
          const type = item.types.find(t => t.startsWith('image/'));
          if (type) {
            imageBlob = await item.getType(type);
            break;
          }
        }

        if (!imageBlob) {
          alert("No screenshot found in clipboard! Please take a quick screenshot of your chart screen first.");
          resetScanBtn();
          return;
        }

        mainScanBtn.innerText = "Analyzing with Gemini 3.7 Flash...";

        const reader = new FileReader();
        reader.onload = async function (e) {
          const base64Data = e.target.result.split(',')[1];
          const mimeType = imageBlob.type || 'image/png';
          await analyzeWithGemini(apiKey, base64Data, mimeType);
        };
        reader.readAsDataURL(imageBlob);

      } catch (err) {
        alert("Clipboard permission required. Grant permission or take a screenshot to copy it to your clipboard.");
        resetScanBtn();
      }
    }

    function resetScanBtn() {
      mainScanBtn.disabled = false;
      mainScanBtn.innerText = "⚡ Scan Clipboard Chart (Gemini 3.7)";
    }

    async function analyzeWithGemini(apiKey, base64Data, mimeType) {
      document.getElementById('results').classList.add('hidden');

      const promptText = `
        You are an institutional quantitative scanner analyzing a Weltrade SyntX chart (FlipX 1, FlipX 2, FX Vol 20, PainX, GainX).
        
        Analyze setup confluence:
        1. BOLLINGER BANDS (20,2): Outer band piercings, contractions, or rejection wicks.
        2. RSI (14): Overbought (>70), Oversold (<30), or center-line cross.
        3. TIMING STATUS: Determine if price is at OPTIMAL ENTRY or LATE ENTRY.
        4. SIGNAL STRENGTH SCORE: Rate from 0% to 100%.

        Strict Output Format:
        --------------------------------------------------
        ACTION SIGNAL: [BUY / CALL or SELL / PUT or HOLD]
        SIGNAL STRENGTH: [0% - 100%]
        TIMING STATUS: [OPTIMAL ENTRY / LATE ENTRY / WAIT FOR RE-TEST]
        RSI & BAND CONFLUENCE: [Analysis]
        PRICE ACTION / WICK REJECTION: [Analysis]
        EXECUTION PLAN: [Entry Zone, Stop Loss, Take Profit]
        --------------------------------------------------
      `;

      const models = ['gemini-3.7-flash', 'gemini-2.5-flash', 'gemini-1.5-flash'];
      let textResponse = null;
      let errorMsg = "";

      for (const model of models) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: mimeType, data: base64Data } }
                ]
              }]
            })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content) {
            textResponse = data.candidates[0].content.parts[0].text;
            break;
          } else if (data.error) {
            errorMsg = data.error.message;
          }
        } catch (err) {
          errorMsg = err.message;
        }
      }

      resetScanBtn();

      if (!textResponse) {
        alert("Gemini Scan Failed: " + (errorMsg || "Invalid API key or network error."));
        return;
      }

      // Populate UI
      document.getElementById('aiOutput').innerText = textResponse;

      const signalBadge = document.getElementById('signalBadge');
      const strengthBadge = document.getElementById('strengthBadge');
      const timingBadge = document.getElementById('timingBadge');

      if (textResponse.includes("BUY")) {
        signalBadge.innerText = "BUY / CALL";
        signalBadge.className = "text-sm font-bold uppercase text-emerald-400";
      } else if (textResponse.includes("SELL")) {
        signalBadge.innerText = "SELL / PUT";
        signalBadge.className = "text-sm font-bold uppercase text-rose-400";
      } else {
        signalBadge.innerText = "HOLD / WAIT";
        signalBadge.className = "text-sm font-bold uppercase text-amber-400";
      }

      const matchStr = textResponse.match(/SIGNAL STRENGTH:\s*(\d+%)/i);
      strengthBadge.innerText = matchStr ? matchStr[1] : "85%";

      if (textResponse.includes("LATE ENTRY")) {
        timingBadge.innerText = "⚠️ LATE ENTRY";
        timingBadge.className = "text-sm font-bold uppercase text-rose-400";
      } else {
        timingBadge.innerText = "⚡ OPTIMAL";
        timingBadge.className = "text-sm font-bold uppercase text-emerald-400";
      }

      document.getElementById('results').classList.remove('hidden');
    }
  </script>
</body>
</html>
