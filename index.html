<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weltrade AI SyntX Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    
    <!-- Header -->
    <header class="flex justify-between items-center pb-5 mb-5 border-b border-slate-800">
      <div>
        <h1 class="text-xl font-bold text-emerald-400">Weltrade AI SyntX Scanner</h1>
        <p class="text-xs text-slate-400 mt-0.5">Pine Script & Price Action Multi-Engine (< 1H)</p>
      </div>
      <span class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full font-mono">v2.3 Live</span>
    </header>

    <!-- API Key Input -->
    <div class="mb-5">
      <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">1. Enter Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="Paste AIzaSy... API Key here" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
      <p class="text-[10px] text-slate-500 mt-1">Key is saved securely in your phone's browser local storage.</p>
    </div>

    <!-- Upload Area -->
    <div class="mb-5">
      <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">2. Upload Weltrade Chart Screenshot</label>
      <div class="border-2 border-dashed border-slate-700 hover:border-emerald-500 bg-slate-950/50 rounded-xl p-5 text-center cursor-pointer relative transition-colors">
        <input type="file" id="chartInput" accept="image/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
        <p class="text-sm font-medium text-slate-300">Click or drop MT4/MT5 / TradingView Chart Screenshot here</p>
        <p class="text-xs text-slate-500 mt-0.5">Supports PainX, GainX, FX Vol, FlipX, Volatility Indices</p>
      </div>
    </div>

    <!-- Image Preview -->
    <div id="previewContainer" class="hidden mb-5 bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
      <img id="chartPreview" class="max-h-56 mx-auto rounded object-contain">
    </div>

    <!-- Scan Button -->
    <button id="scanBtn" onclick="analyzeChartWithAI()" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-semibold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
      <span>Scan Chart Setup</span>
    </button>

    <!-- Results Box -->
    <div id="results" class="hidden mt-6 bg-slate-950 border border-slate-800 rounded-xl p-5">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-3">
        <span class="text-xs font-semibold uppercase text-slate-400">Trading Insight</span>
        <span id="signalBadge" class="text-xs px-2.5 py-1 rounded font-bold uppercase">--</span>
      </div>
      <div id="aiOutput" class="text-xs leading-relaxed text-slate-300 whitespace-pre-wrap font-mono">
        <!-- AI Response renders here -->
      </div>
    </div>

  </div>

  <script>
    const chartInput = document.getElementById('chartInput');
    const chartPreview = document.getElementById('chartPreview');
    const previewContainer = document.getElementById('previewContainer');
    const scanBtn = document.getElementById('scanBtn');
    const apiKeyInput = document.getElementById('apiKey');

    let base64Image = "";
    let mimeType = "image/png";

    // Auto-load saved API key
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) apiKeyInput.value = savedKey;
    });

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    chartInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      mimeType = file.type || "image/png";
      const reader = new FileReader();
      reader.onload = function(event) {
        base64Image = event.target.result.split(',')[1];
        chartPreview.src = event.target.result;
        previewContainer.classList.remove('hidden');
        scanBtn.disabled = false;
      }
      reader.readAsDataURL(file);
    });

    async function analyzeChartWithAI() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Please enter your Gemini API Key in field #1.");
        return;
      }

      const results = document.getElementById('results');
      const signalBadge = document.getElementById('signalBadge');
      const aiOutput = document.getElementById('aiOutput');

      scanBtn.disabled = true;
      scanBtn.innerText = "Evaluating Pine Strategy & Vision Engine...";
      results.classList.add('hidden');

      const promptText = `
        You are an institutional algorithmic quantitative trader analyzing a synthetic index chart screenshot for short-term (< 1 Hour timeframe) entries.
        
        Evaluate the image using built-in Pine Script / Price Action indicator rules:
        1. BOLLINGER BANDS (20,2): Look for price touching or closing outside upper/lower bands.
        2. RSI (14): Check for Overbought (>70), Oversold (<30), or Divergence against price action.
        3. CANDLE RANGE THEORY (CRT) / SMC: Check for liquidity sweeps (wick spikes taking out previous highs/lows) or Fair Value Gap (FVG) retests.
        4. CANDLESTICK REJECTION: Look for pinbars, engulfing patterns, or institutional rejection wicks at key levels.

        If indicators are missing from the image, explicitly state that indicators need to be added to the chart, but still analyze raw candlestick structure (market structure, highs/lows).

        Output format strictly:
        --------------------------------------------------
        ACTION SIGNAL: [BUY / CALL or SELL / PUT or NO TRADE / HOLD]
        CONFIRMATION SCORE: [1 to 10]
        RSI ANALYSIS: [Details]
        BOLLINGER BAND STATUS: [Details]
        PRICE ACTION & CRT SETUP: [Details on wicks, liquidity sweeps, or candle structure]
        RECOMMENDED ENTRY: [Exact execution instruction]
        STOP LOSS: [Placement recommendation]
        TAKE PROFIT: [Target placement]
        --------------------------------------------------
      `;

      const models = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite'];
      let textResponse = null;
      let lastError = null;

      for (const model of models) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: mimeType, data: base64Image } }
                ]
              }]
            })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
            textResponse = data.candidates[0].content.parts[0].text;
            break;
          } else if (data.error) {
            lastError = data.error.message;
          }
        } catch (e) {
          lastError = e.message;
        }
      }

      if (!textResponse) {
        alert("API Error: " + (lastError || "Could not reach Gemini API. Please check your API Key."));
        scanBtn.disabled = false;
        scanBtn.innerText = "Scan Chart Setup";
        return;
      }

      aiOutput.innerText = textResponse;

      if (textResponse.includes("BUY")) {
        signalBadge.innerText = "BUY / CALL";
        signalBadge.className = "text-xs px-2.5 py-1 rounded font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
      } else if (textResponse.includes("SELL")) {
        signalBadge.innerText = "SELL / PUT";
        signalBadge.className = "text-xs px-2.5 py-1 rounded font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30";
      } else {
        signalBadge.innerText = "NEUTRAL / HOLD";
        signalBadge.className = "text-xs px-2.5 py-1 rounded font-bold bg-amber-500/20 text-amber-400 border border-amber-500/30";
      }

      results.classList.remove('hidden');
      scanBtn.disabled = false;
      scanBtn.innerText = "Scan Chart Setup";
    }
  </script>
</body>
</html>
