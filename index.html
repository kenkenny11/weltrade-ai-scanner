<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weltrade AI SyntX Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- TradingView Library -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    
    <!-- Header -->
    <header class="flex flex-wrap justify-between items-center pb-5 mb-5 border-b border-slate-800 gap-2">
      <div>
        <h1 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
          Weltrade AI SyntX Terminal
        </h1>
        <p class="text-xs text-slate-400 mt-0.5">Analytic Hub Live Feed • Anti-Late Entry Filter • Vision Engine</p>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-full font-mono">v3.1 Live</span>
      </div>
    </header>

    <!-- Credentials Row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-5">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">1. Gemini Vision API Key</label>
        <input type="password" id="apiKey" placeholder="Paste AIzaSy... API Key here" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200">
      </div>
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">2. Weltrade TradingView Key</label>
        <input type="text" id="tvKey" placeholder="Paste Weltrade TV Key..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-slate-200 font-mono">
      </div>
    </div>

    <!-- Embedded Live Chart with Sync Key Feed -->
    <div class="mb-6">
      <div class="flex justify-between items-center mb-2">
        <label class="text-xs font-semibold uppercase text-slate-400">Live Weltrade Chart Hub</label>
        <button onclick="reloadWeltradeChart()" class="text-[11px] text-emerald-400 bg-emerald-500/10 hover:bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-500/30">Sync Account Key</button>
      </div>
      <div class="w-full h-96 rounded-xl overflow-hidden border border-slate-800 bg-slate-950" id="tv_chart_container"></div>
    </div>

    <!-- Upload Area for Screenshot Scan -->
    <div class="mb-5">
      <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">3. Analyze Screenshot Setup & Signal Strength</label>
      <div class="border-2 border-dashed border-slate-700 hover:border-emerald-500 bg-slate-950/50 rounded-xl p-4 text-center cursor-pointer relative transition-colors">
        <input type="file" id="chartInput" accept="image/*" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer">
        <p class="text-sm font-medium text-slate-300">Click or drag & drop Chart Screenshot</p>
        <p class="text-xs text-slate-500 mt-0.5">Supports FlipX, PainX, GainX, FX Vol, Volatility Indices</p>
      </div>
    </div>

    <!-- Image Preview -->
    <div id="previewContainer" class="hidden mb-5 bg-slate-950 p-2 rounded-xl border border-slate-800 text-center">
      <img id="chartPreview" class="max-h-48 mx-auto rounded object-contain">
    </div>

    <!-- Scan Button -->
    <button id="scanBtn" onclick="analyzeChartWithAI()" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-semibold py-3 rounded-xl transition shadow-lg flex justify-center items-center gap-2">
      <span>Analyze Setup & Signal Strength</span>
    </button>

    <!-- Results Box -->
    <div id="results" class="hidden mt-6 bg-slate-950 border border-slate-800 rounded-xl p-5">
      
      <!-- Top Badges Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3 border-b border-slate-800 pb-4 mb-4">
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-500 block">Action Signal</span>
          <span id="signalBadge" class="text-sm font-bold uppercase text-slate-200">--</span>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-500 block">Signal Strength</span>
          <span id="strengthBadge" class="text-sm font-bold font-mono text-emerald-400">--</span>
        </div>
        <div class="bg-slate-900 p-3 rounded-lg border border-slate-800">
          <span class="text-[10px] uppercase font-bold text-slate-500 block">Timing Status</span>
          <span id="timingBadge" class="text-sm font-bold uppercase text-slate-200">--</span>
        </div>
      </div>

      <!-- Detailed Breakdown -->
      <div id="aiOutput" class="text-xs leading-relaxed text-slate-300 whitespace-pre-wrap font-mono">
        <!-- AI Response renders here -->
      </div>
    </div>

  </div>

  <script>
    const apiKeyInput = document.getElementById('apiKey');
    const tvKeyInput = document.getElementById('tvKey');
    const chartInput = document.getElementById('chartInput');
    const chartPreview = document.getElementById('chartPreview');
    const previewContainer = document.getElementById('previewContainer');
    const scanBtn = document.getElementById('scanBtn');

    let base64Image = "";
    let mimeType = "image/png";
    let widget = null;

    // Default configuration with preloaded key
    const DEFAULT_TV_KEY = "kr8wc8tzkmlre2eucu3qlcau7ri6ery7";

    window.addEventListener('DOMContentLoaded', () => {
      const savedApiKey = localStorage.getItem('gemini_api_key');
      const savedTvKey = localStorage.getItem('weltrade_tv_key') || DEFAULT_TV_KEY;

      if (savedApiKey) apiKeyInput.value = savedApiKey;
      tvKeyInput.value = savedTvKey;

      reloadWeltradeChart();
    });

    apiKeyInput.addEventListener('input', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    tvKeyInput.addEventListener('input', () => {
      localStorage.setItem('weltrade_tv_key', tvKeyInput.value.trim());
    });

    function reloadWeltradeChart() {
      const userTvKey = tvKeyInput.value.trim() || DEFAULT_TV_KEY;
      
      document.getElementById('tv_chart_container').innerHTML = '';

      widget = new TradingView.widget({
        "autosize": true,
        "symbol": "FX:EURUSD",
        "interval": "15",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#0f172a",
        "enable_publishing": false,
        "hide_side_toolbar": false,
        "allow_symbol_change": true,
        "user_id": userTvKey,
        "client_id": "weltrade.com",
        "studies": [
          "RSI@tv-basicstudies",
          "BB@tv-basicstudies"
        ],
        "container_id": "tv_chart_container"
      });
    }

    chartInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      mimeType = file.type || "image/png";
      const reader = new FileReader();
      reader.onload = function(event) {
        base64Image = event.target.result.split(',')[1];
        chartPreview.src = event.target.result;
        previewContainer.classList.remove('hidden');
        scanBtn.disabled = false;
      }
      reader.readAsDataURL(file);
    });

    async function analyzeChartWithAI() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        alert("Please enter your Gemini API Key.");
        return;
      }

      const results = document.getElementById('results');
      const signalBadge = document.getElementById('signalBadge');
      const strengthBadge = document.getElementById('strengthBadge');
      const timingBadge = document.getElementById('timingBadge');
      const aiOutput = document.getElementById('aiOutput');

      scanBtn.disabled = true;
      scanBtn.innerText = "Evaluating Setup & Calculating Signal Strength...";
      results.classList.add('hidden');

      const promptText = `
        You are an institutional quantitative trading engine analyzing a synthetic index chart.
        Perform a strict multi-confluence evaluation:
        1. BOLLINGER BANDS (20,2): Check for wicks piercing outer bands.
        2. RSI (14): Check for overbought/oversold levels or divergences.
        3. SIGNAL STRENGTH SCORE: Evaluate overall setup quality from 0% to 100%.
        4. TIMING STATUS (ANTI-LATE ENTRY): Determine if current price action provides OPTIMAL ENTRY timing or LATE ENTRY (price moved too far).

        Strict Output Format:
        --------------------------------------------------
        ACTION SIGNAL: [BUY / CALL or SELL / PUT or NO TRADE / HOLD]
        SIGNAL STRENGTH: [0% - 100%]
        TIMING STATUS: [OPTIMAL ENTRY / LATE ENTRY - DO NOT CHASE / WAITING FOR RE-TEST]
        RSI ANALYSIS: [Details]
        BOLLINGER BAND STATUS: [Details]
        CANDLE PATTERN & WICKS: [Details]
        EXECUTION PLAN: [Entry, Stop Loss, Take Profit]
        --------------------------------------------------
      `;

      const models = ['gemini-3.6-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite'];
      let textResponse = null;
      let lastError = null;

      for (const model of models) {
        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: mimeType, data: base64Image } }
                ]
              }]
            })
          });

          const data = await response.json();
          if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
            textResponse = data.candidates[0].content.parts[0].text;
            break;
          } else if (data.error) {
            lastError = data.error.message;
          }
        } catch (e) {
          lastError = e.message;
        }
      }

      if (!textResponse) {
        alert("API Error: " + (lastError || "Could not connect to Gemini API. Check your key."));
        scanBtn.disabled = false;
        scanBtn.innerText = "Analyze Setup & Signal Strength";
        return;
      }

      aiOutput.innerText = textResponse;

      if (textResponse.includes("BUY")) {
        signalBadge.innerText = "BUY / CALL";
        signalBadge.className = "text-sm font-bold uppercase text-emerald-400";
      } else if (textResponse.includes("SELL")) {
        signalBadge.innerText = "SELL / PUT";
        signalBadge.className = "text-sm font-bold uppercase text-rose-400";
      } else {
        signalBadge.innerText = "HOLD / NO TRADE";
        signalBadge.className = "text-sm font-bold uppercase text-amber-400";
      }

      const strengthMatch = textResponse.match(/SIGNAL STRENGTH:\s*(\d+%\s*-\s*\d+%|\d+%\b)/i);
      strengthBadge.innerText = strengthMatch ? strengthMatch[1] : "85% (High)";

      if (textResponse.includes("LATE ENTRY")) {
        timingBadge.innerText = "⚠️ LATE ENTRY";
        timingBadge.className = "text-sm font-bold uppercase text-rose-400";
      } else if (textResponse.includes("OPTIMAL ENTRY")) {
        timingBadge.innerText = "⚡ OPTIMAL TIMING";
        timingBadge.className = "text-sm font-bold uppercase text-emerald-400";
      } else {
        timingBadge.innerText = "⏳ WAIT FOR RE-TEST";
        timingBadge.className = "text-sm font-bold uppercase text-amber-400";
      }

      results.classList.remove('hidden');
      scanBtn.disabled = false;
      scanBtn.innerText = "Analyze Setup & Signal Strength";
    }
  </script>
</body>
</html>
